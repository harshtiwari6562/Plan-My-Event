<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan My Event - Your Complete Event Planning Solution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: rgba(255, 99, 132, 0.2);
            top: -100px;
            right: -50px;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: rgba(147, 112, 219, 0.2);
            bottom: -50px;
            right: 100px;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: rgba(86, 204, 242, 0.2);
            bottom: 50px;
            left: -50px;
        }

        .shape-4 {
            width: 80px;
            height: 80px;
            background: rgba(255, 182, 193, 0.2);
            top: 50px;
            left: 100px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            padding: 20px;
        }

        .login-section {
            flex: 1;
            max-width: 400px;
            padding: 40px;
        }

        .content-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .logo {
            font-size: 32px;
            color: #6c63ff;
            margin-bottom: 40px;
            font-weight: bold;
            text-align: center;
        }

        .login-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            background: #f8f8f8;
        }

        .divider {
            text-align: center;
            color: #666;
            margin: 20px 0;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f8f8;
        }

        input:focus {
            outline: none;
            border-color: #6c63ff;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #666;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .forgot-link {
            color: #6c63ff;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: #5b54d6;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .signup-link a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: bold;
        }

        .content-text {
            text-align: center;
            padding: 0 40px;
        }

        .content-text h2 {
            font-size: 48px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .login-section {
                max-width: 100%;
            }

            .content-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>

    <div class="container">
        <div class="login-section">
            <div class="logo">Plan My Event</div>
            <h1 class="login-title">Welcome Back!</h1>
            
            <form id="loginForm" onsubmit="return validateForm(event)">
                <button type="button" class="google-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="20">
                    Sign in with Google
                </button>

                <div class="divider">Or sign in with email</div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="remember-forgot">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Keep me logged in</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <div class="signup-link">
                    Don't have an account? <a href="#">Sign up</a>
                </div>
            </form>
        </div>

        <div class="content-section">
            <div class="content-text">
                <h2>Plan Your Events<br>With Ease</h2>
                <p style="font-size: 18px; color: #666; margin-top: 20px;">Your complete event planning solution</p>
            </div>
        </div>
    </div>

    <script>
        // Add event listeners when the document loads
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            const isLoggedIn = localStorage.getItem('userLoggedIn');
            if (isLoggedIn) {
                window.location.href = 'main.html';
            }

            const googleBtn = document.querySelector('.google-btn');
            
            // Add click event listener to Google sign in button
            googleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // For demo purposes, just redirect
                localStorage.setItem('userLoggedIn', 'true');
                window.location.href = 'main.html';
            });
        });

        function validateForm(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Please enter both email and password');
                return false;
            }

            // For demo purposes, accept any email/password
            localStorage.setItem('userLoggedIn', 'true');
            window.location.href = 'main.html';
            return false;
        }
    </script>
</body>
</html>
